name: Publish daily edition

on:
  schedule:
    - cron: "17 13 * * *"
      timezone: "America/Detroit"
    - cron: "37 15 * * *"
      timezone: "America/Detroit"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-reader-daily-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:daily
      - run: npm test
      - run: npm run build
      - name: Commit a new edition when one was created
        run: |
          if git diff --quiet -- content/daily-editions.json content/daily-editions.js; then
            echo "Today's edition already exists."
          else
            git config user.name "Nightly Reader Curator"
            git config user.email "actions@users.noreply.github.com"
            git add content/daily-editions.json content/daily-editions.js
            git commit -m "Publish daily edition $(date -u +%F)"
            git push
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2
      - name: Deploy verified edition to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

          for attempt in 1 2; do
            echo "Starting production deployment (attempt $attempt of 2)…"
            if ! deployment_url="$(vercel deploy --prebuilt --prod --force --yes --no-wait --token="$VERCEL_TOKEN")"; then
              echo "Vercel rejected this deployment attempt. Retrying."
              continue
            fi

            if vercel inspect "$deployment_url" --wait --timeout 6m --token="$VERCEL_TOKEN"; then
              echo "Production deployment is ready: $deployment_url"
              exit 0
            fi

            echo "Deployment did not become ready in time. Retrying with a fresh deployment."
          done

          echo "Vercel did not complete either deployment attempt."
          exit 1
